name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  pypi_release:
    name: Builds Using Poetry and Publishes to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Get Poetry version
        run: poetry --version
      - name: Check pyproject.toml validity
        run: |
          poetry lock
          poetry check --no-interaction
      - name: Setup package
        run: poetry install --no-interaction
      - run: poetry config pypi-token.pypi "${{ secrets.PYPI_TOKEN }}"
      - name: Publish package
        run: poetry publish --build
      - name: Upload build artifacts to GitHub Release
        # Only runs when this workflow was triggered by an actual
        # GitHub release being published - `workflow_dispatch` runs
        # have no release to attach files to, so this step is skipped
        # (not failed) on that trigger.
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          # `poetry publish --build` leaves the built .tar.gz and .whl
          # in dist/ - globbing here means this never needs a manual
          # edit when the version number changes.
          files: dist/*
